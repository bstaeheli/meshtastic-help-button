name: build
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: ref
        run: echo "sha=$(<FORK_REF)" >>"$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: bstaeheli/firmware
          ref: ${{ steps.ref.outputs.sha }}
          path: firmware
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: sudo apt-get update -y && sudo apt-get install -y libbluetooth-dev libgpiod-dev libyaml-cpp-dev
      - run: platformio test -e coverage -f test_user_button_actions
        working-directory: firmware
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, for the version in UF2 names
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('requirements.txt', 'config/help-button.ini', 'FORK_REF') }}
          restore-keys: pio-
      - run: pip install -r requirements.txt
      - run: scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
