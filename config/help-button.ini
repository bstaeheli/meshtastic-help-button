; Build preset, appended to the fork's platformio.ini by scripts/build.sh.
; Flags map 1:1 to UserButtonActionsConfig in src/input/UserButtonActions.h.
; String flags need the quadruple backslash: \"\\\\x07HELP\" reaches the C compiler
; as "\x07HELP". \x escapes are greedy: text right after the bell must not
; start with a hex digit (0-9, A-F, a-f). Use -D UBA_ACK_TEXT=nullptr to
; disable the ack message.

[env:rak_wismeshtag_sos]
extends = env:rak_wismeshtag
build_flags = ${env:rak_wismeshtag.build_flags}
    -D MESHTASTIC_USER_BUTTON_ACTIONS=1
    -D UBA_SINGLE_PRESS=BUTTON_ACTION_ACK_OR_ALERT
    -D UBA_DOUBLE_PRESS=BUTTON_ACTION_ACK_OR_ALERT
    -D UBA_MULTI_PRESS=BUTTON_ACTION_ACK_OR_ALERT
    -D UBA_ALERT_TEXT=\"\\\\x07HELP\"
    -D UBA_ACK_TEXT=\"\\\\x07OK\"
    -D UBA_ALERT_WITH_POSITION=1
    -D UBA_ALERT_MIN_INTERVAL_SECS=30
    -D UBA_LONG_PRESS_SHUTDOWN_MS=15000
