; Build preset, appended to the fork's platformio.ini by scripts/build.sh, which
; fills the @PLACEHOLDERS@ (texts, seconds) from its validated parameters.
; Flags map 1:1 to UserButtonActionsConfig in src/input/UserButtonActions.h.
; String flags: \"\\\\007@HELP_TEXT@\" reaches the C compiler as "\007HELP" (bell
; as an octal escape, which ends after three digits, so any text may follow).
; Use -D UBA_ACK_TEXT=nullptr to disable the ack message.

[env:rak_wismeshtag_sos]
extends = env:rak_wismeshtag
build_flags = ${env:rak_wismeshtag.build_flags}
    -D MESHTASTIC_USER_BUTTON_ACTIONS=1
    -D UBA_SINGLE_PRESS=BUTTON_ACTION_ACK_OR_ALERT
    -D UBA_DOUBLE_PRESS=BUTTON_ACTION_ACK_OR_ALERT2
    -D UBA_MULTI_PRESS=BUTTON_ACTION_ACK_OR_ALERT2
    -D UBA_ALERT_TEXT=\"\\\\007@HELP_TEXT@\"
    -D UBA_ALERT2_TEXT=\"\\\\007@SOS_TEXT@\"
    -D UBA_ACK_TEXT=\"\\\\007@OK_TEXT@\"
    -D UBA_ALERT_WITH_POSITION=1
    -D UBA_ALERT_MIN_INTERVAL_SECS=@RATE_SECS@
    -D UBA_HOLD_ALERT_MAX_MS=@HOLD_MS@
    -D UBA_LONG_PRESS_SHUTDOWN_MS=@OFF_MS@
